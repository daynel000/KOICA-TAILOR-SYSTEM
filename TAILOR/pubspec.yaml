name: tailor_connect
description: TailorConnect - Customer Mobile App (Flutter)
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI & Icons
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0

  # Navigation
  go_router: ^12.1.3

  # State Management
  provider: ^6.1.2

  # HTTP Networking (for connecting to Python backend later)
  http: ^1.2.1
  dio: ^5.4.3+1

  # Local Storage (replaces localStorage for mobile)
  shared_preferences: ^2.2.3

  # Image Picker (for AI Scan photo upload)
  image_picker: ^1.0.7

  # Map & Location (OpenStreetMap via flutter_map)
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^12.0.0
  permission_handler: ^11.3.1
  url_launcher: ^6.3.0

  # Other Utilities
  intl: ^0.19.0
  camera: ^0.10.5+9

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
